# Agent Vitals Threshold Configuration
#
# This file externalizes all detection thresholds used by the vitals
# loop/stuck detection engine. Changes here are picked up by VitalsConfig
# when loading from YAML (see config.py).
#
# Environment variables override these values when set.

# --- Loop Detection ---
# Content similarity threshold for output-based loop detection.
# When output_text is provided to step(), consecutive outputs with
# Jaccard similarity >= this threshold trigger the content_similarity signal.
loop_similarity_threshold: 0.8
# Adaptive loop evidence threshold:
#   threshold = max(2, floor(trace_length * loop_consecutive_pct))
loop_consecutive_pct: 0.5

# Adaptive findings plateau window:
#   window = max(2, floor(trace_length * findings_plateau_pct))
findings_plateau_pct: 0.4

# Statistical minimum evidence floor. No detector fires when trace length is below this.
min_evidence_steps: 3

# Source-to-finding ratio confabulation floor.
# ratio = sources_count / findings_count
# ratio < floor indicates likely findings inflation / confabulation risk.
source_finding_ratio_floor: 0.3

# Declining ratio steps required for trajectory-based confab signal.
# Within the decline_window, at least this many step-over-step declines
# must occur (they need not be consecutive).
source_finding_ratio_declining_steps: 3

# Sliding window size for counting ratio declines.
# The detector counts step-over-step declines in the last N steps.
# Default 5 tolerates 2 non-declining steps in the window.
source_finding_ratio_decline_window: 5

# --- Causal Confabulation Detection ---
# Rolling partial-correlation detector that monitors the structural link
# between findings growth and sources growth, residualized against token spend.
causal_confab_window_size: 4
causal_confab_baseline_floor: 0.4
causal_confab_weak_link_threshold: 0.35
causal_confab_structural_drop_threshold: 0.2
causal_confab_ratio_gate: 0.4
causal_confab_low_link_threshold: 0.2
causal_confab_source_bootstrap_cap: 10
causal_confab_low_link_ratio_gate: 0.3

# Path 3: verified source decoupling (real LLM confabulation via DOI verification).
# Only fires when verified_sources_count is present on snapshots.
causal_confab_verified_link_floor: 0.5
causal_confab_verified_weak_threshold: 0.25
causal_confab_verified_drop_threshold: 0.15
causal_confab_verified_ratio_gate: 0.3
causal_confab_verified_min_sources: 10

# Legacy absolute threshold retained for backward compatibility only.
loop_consecutive_count: 3

# --- Stuck Detection ---
stuck_dm_threshold: 0.15
stuck_cv_threshold: 0.3
burn_rate_multiplier: 3.0

# Error-count threshold for thrash detection via stop rule.
# When error_count >= this value, thrash is flagged. Set 0 to disable.
thrash_error_threshold: 1

# Token normalization scale factor for models with different tokenization.
# Set < 1.0 for large models that produce more tokens per step (e.g. 0.5 for 120B models).
# Default 1.0 = no scaling (identity for cloud models).
token_scale_factor: 1.0

# Workflow scope for stuck detection.
# Options: research-only | build-only | all | none
workflow_stuck_enabled: research-only

# --- CUSUM Change-Point Detection ---
# CUSUMTracker params for the three metric trackers in AgentVitals.
# k = k_sigma * sigma, H = h_sigma * sigma (standard SPC parameterization).
# min_sigma floors reduce false alarms on low-variance streams.
cusum_k_sigma: 0.5
cusum_h_sigma: 4.0
cusum_warmup_steps: 2
cusum_min_sigma_similarity: 0.05
cusum_min_sigma_tokens: 25.0
cusum_min_sigma_findings: 0.5

# --- SPC Adaptive Thresholding ---
# AdaptiveThreshold uses WMA control limits after warmup:
#   UCL/LCL = WMA +/- (spc_k_sigma * sigma_rolling)
# where WMA applies exponential decay (spc_wma_decay) to favor recent values.
spc_k_sigma: 3.0
spc_window_size: 5
spc_warmup_steps: 2
spc_cooldown_steps: 1
spc_wma_decay: 0.7

# --- Temporal Hysteresis ---
th_enter_warning: 0.4
th_exit_warning: 0.6
th_enter_critical: 0.2
th_exit_critical: 0.35

# --- Framework-Specific Threshold Profiles ---
#
# Per-adapter overrides for detection thresholds. When an adapter is used
# (or framework= is passed explicitly), matching profile overrides are
# applied on top of the defaults above. Only specified fields are overridden;
# omitted fields inherit the default values.
profiles:
  # LangGraph: stateful graph execution with relatively short traces.
  langgraph:
    loop_consecutive_pct: 0.4
    burn_rate_multiplier: 3.0

  # CrewAI: multi-agent orchestration, higher token counts, longer runs.
  # More lenient loop detection — agent handoffs look like repetition.
  #
  # NOTE (v1.14.1 / AV-S08-M04): burn_rate_multiplier is intentionally
  # NOT overridden. A prior tune bumped it to 3.0 based on runaway_cost
  # numbers; v1.14.1 reverted it after bench found 35 stuck FPs on the
  # crewai × default cell. The mechanism (then implicit, now explicit)
  # is that burn-rate runaway and stuck arbitrate against each other
  # on short runaway-positive traces — when burn-rate fires, stuck is
  # explicitly suppressed in `_resolve_detections`. Raising the
  # multiplier stops burn-rate from firing on those traces, removes
  # the suppression, and lets stuck leak as FPs.
  #
  # AV-S08-M04 replaced the implicit chain with explicit logic. The
  # arbitration trade-off remains real, so any future per-profile
  # burn_rate_multiplier override must verify stuck FP counts on the
  # elicited runaway corpus before merging.
  crewai:
    loop_consecutive_pct: 0.5
    token_scale_factor: 0.7

  # DSPy: optimization loops are naturally repetitive. Very lenient loop
  # detection, tighter stuck threshold, disable stuck detection entirely
  # (DSPy has its own termination logic).
  dspy:
    loop_consecutive_pct: 0.7
    stuck_dm_threshold: 0.1
    workflow_stuck_enabled: none
